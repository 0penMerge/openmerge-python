[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openmerge"
version = "0.1.0"
description = "Typed Python client for the OpenMerge unified integration API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "OpenMerge" }]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
keywords = ["openmerge", "ipaas", "integrations", "crm"]

[project.urls]
Homepage = "https://openmerge.dev"
Repository = "https://github.com/0penMerge/openmerge-python"
Issues = "https://github.com/0penMerge/openmerge-python/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/openmerge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["openmerge"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
